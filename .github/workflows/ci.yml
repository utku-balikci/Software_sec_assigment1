name: CI Pipeline (Security Gate & Tests)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies & build external package
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn requests pyjwt pytest flake8 bandit build wheel
        cd packages/html_note_formatter
        python -m build --wheel
        pip install dist/*.whl
        cd ../..

    - name: Stage 1 - Static Analysis & Security Gate (Bandit)
      run: |
        bandit -r services/ -ll || true

    - name: Stage 2 - Run Microservices & Functional/Authorization Tests
      run: |
        # Start microservices in background (Secure Mode)
        python run_services.py &
        RUNNER_PID=$!
        sleep 4

        # Run full integration test suite
        pytest -v tests/test_flow.py --junitxml=test-results.xml

        # Terminate services
        kill -TERM $RUNNER_PID || true

    - name: Stage 3 - Verify Planted Vulnerabilities Suite
      run: |
        # 1. Test secure baseline defenses
        python run_services.py &
        PID_SECURE=$!
        sleep 4
        pytest -s -v tests/test_vulnerabilities.py
        kill -TERM $PID_SECURE || true
        sleep 2

        # 2. Test vulnerable mode exploits
        python run_services.py --vulnerable &
        PID_VULN=$!
        sleep 4
        pytest -s -v tests/test_vulnerabilities.py
        kill -TERM $PID_VULN || true

    - name: Archive Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results.xml
